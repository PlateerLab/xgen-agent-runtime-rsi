[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xgen-agent-runtime-rsi"
version = "0.6.0"
description = "XGEN RSI harness — a swap-in agent harness that evolves itself with RRSI (regularized harness evolution) and Dream-RSI (replay-based exploration policy improvement)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "CocoRoF", email = "cocorof@users.noreply.github.com" }]
keywords = ["agent", "harness", "rsi", "rrsi", "dream-rsi", "self-improvement", "llm", "xgen"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# geny-rsi 는 독립 패키지다 — xgen-agent-runtime 을 의존하지 않는다. 바탕 런타임(공급자 계층·도구·기억·호스트 계약)은
# xgen-agent-runtime 4.81.0 을 복사한 ``xgen_rsi.base`` 이고, 아래는 그 사본이 쓰는 외부 라이브러리다.
# 하한만 둔다 — 소비자(xgen-workflow)가 requirements.lock 으로 정확히 고정하고, 같은 환경의 다른 패키지와 겹쳐도 갈리지 않게.
dependencies = [
    "anthropic[bedrock]>=0.125.0",
    "mcp>=1.30.0",
    "pydantic>=2.12.5",
    "jsonschema>=4.26.0",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "websockets>=16.1.1",
    "pyyaml>=6.0.2",
    "numpy>=2.3.2",
    "croniter>=6.2.4",
    "ddgs>=9.16.0",
    "openai>=2.54.0",
    "google-genai>=1.75.0",
    "google-auth>=2.59.0",
    "psycopg[binary]>=3.3.6",
    "pgvector>=0.5.0",
    "qdrant-client>=1.16.0",
    "asyncssh>=2.23.1",
    # 문서 읽기(ParseDocument). doc2chunk 는 xgen-pdf 를 이름으로만 요구하고 xgen-pdf 는 어느 인덱스에도 없어 URL 로 적는다.
    "xgen-doc2chunk>=0.4.2",
    "xgen-pdf @ https://github.com/PlateerLab/xgen-pdf/releases/download/v0.1.2/xgen_pdf-0.1.2-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4.0",
    "mypy>=1.10",
    # 수식 차분 테스트의 기준(공식 RRSI 구현, Apache-2.0). 실행 코드는 import 하지 않는다.
    "rrsi @ git+https://github.com/google-research/rrsi.git@be50316e1db05914068a973f322770ef08ed7ba1",
]

[project.scripts]
rsi = "xgen_rsi.cli:main"

[project.urls]
Repository = "https://github.com/PlateerLab/xgen-agent-runtime-rsi"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/xgen_rsi"]
artifacts = ["src/xgen_rsi/harnesses/**/*.md", "src/xgen_rsi/harnesses/**/*.json", "src/xgen_rsi/evolve/constitution/**/*.md", "src/xgen_rsi/suites/**/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
# xgen_rsi/base 는 xgen-agent-runtime 4.81.0 사본이다 — 원본과 비교해 갱신하기 쉽게 모듈 경로 말고는 손대지 않는다.
extend-exclude = ["src/xgen_rsi/base"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/xgen_rsi/rsi_math"]
strict = true
