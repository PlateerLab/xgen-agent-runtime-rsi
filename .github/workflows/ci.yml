name: CI — xgen-agent-runtime-rsi (geny-rsi)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 런타임은 PyPI 가 아니라 GitHub Release wheel 로 배포된다 — 같은 방식으로 먼저 설치한다.
  RUNTIME_WHEEL: "xgen-agent-runtime @ https://github.com/PlateerLab/xgen-agent-runtime/releases/download/v4.80.0/xgen_agent_runtime-4.80.0-py3-none-any.whl"
  PDF_WHEEL: "xgen-pdf @ https://github.com/PlateerLab/xgen-pdf/releases/download/v0.1.2/xgen_pdf-0.1.2-py3-none-any.whl"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ tests/ experiments/

  type-check:
    name: Type check (rsi_math strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install --upgrade pip
          pip install "$RUNTIME_WHEEL" "$PDF_WHEEL"
          pip install -e ".[dev]"
      - run: mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          pip install --upgrade pip
          pip install "$RUNTIME_WHEEL" "$PDF_WHEEL"
          pip install -e ".[dev]"
      - run: pytest -q -p no:warnings

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: 설치되고 import 되는지, 하네스·스위트 데이터가 들어 있는지
        run: |
          pip install "$RUNTIME_WHEEL" "$PDF_WHEEL" dist/*.whl
          python -c "import xgen_rsi; from xgen_rsi import GenyRSI; print('xgen_rsi', xgen_rsi.__version__)"
          rsi harness validate
          rsi suite build /tmp/xc --suite xgen-hard
