name: CI — xgen-agent-runtime-rsi (geny-rsi)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ tests/ experiments/

  type-check:
    name: Type check (rsi_math strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - run: mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: xgen-agent-runtime 없이 돈다(독립 패키지)
        run: |
          python -c "import importlib.util as u, sys; sys.exit(1 if u.find_spec('xgen_agent_runtime') else 0)"
          ! grep -rn "xgen_agent_runtime" src/
      - run: pytest -q -p no:warnings

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: 설치되고 import 되는지, 하네스·스위트 데이터가 들어 있는지
        run: |
          pip install dist/*.whl
          python -c "import xgen_rsi; from xgen_rsi import GenyRSI; print('xgen_rsi', xgen_rsi.__version__)"
          rsi harness validate
          rsi suite build /tmp/xc --suite xgen-hard
